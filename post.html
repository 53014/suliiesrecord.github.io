---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}">← 모든 기록</a>
    <p class="eyebrow">A PAGE FROM MY JOURNAL</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %m월 %d일" }}</time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
