---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %m월 %d일" }}</time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p class="back"><a href="{{ '/' | relative_url }}">← 목록으로</a></p>
</article>
